providers:
  script_generator: fallback_chain
  tts_engine: kokoro
script_generation:
  fallback_chain:
  - gemini
  - gemini_lite
  - groq
  gemini:
    model: gemini-2.5-flash
    temperature: 1
    max_output_tokens: 8192
    daily_limit: 18
  gemini_lite:
    model: gemini-2.5-flash-lite
    temperature: 1
    max_output_tokens: 8192
    daily_limit: 0
  groq:
    model: openai/gpt-oss-20b
    temperature: 1
    max_output_tokens: 8192
    daily_limit: 0
    structured_output_mode: json_schema
  target_duration_minutes: 30
  num_segments: 6
  words_per_minute: 150
  max_retries_per_segment: 3
  forbidden_phrases:
  - that's such a great point
  - absolutely
  - i couldn't agree more
  - great question
tts:
  kokoro:
    sample_rate: 24000
    speed: 1
    lang_code: a
  pause_between_turns_ms: 400
  pause_between_segments_ms: 900
video:
  subtitle_font_size: 52
  font_path: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
  crf: 23
paths:
  jobs_dir: data/jobs
  state_db: data/state/jobs.db
  usage_db: data/state/provider_usage.db
  logs_dir: data/logs
  assets_dir: data/assets
